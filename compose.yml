services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: oto
      POSTGRES_USER: oto_app
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Configure DATABASE_PASSWORD}
    volumes:
      - oto_integrado:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oto_app -d oto"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/oto
      DATABASE_USER: oto_app
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Configure DATABASE_PASSWORD}
      ADMIN_IDENTIFIER: ${ADMIN_IDENTIFIER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8081}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - api
volumes:
  oto_integrado:
